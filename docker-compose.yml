name: fraud-pipeline

# Version "légère" : limites mémoire pour machines de 8 à 16 Go de RAM.
# Total des plafonds : environ 7,5 Go (la consommation réelle est en général plus basse).

services:
  # ---------- Kafka (mode KRaft, sans Zookeeper) ----------
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    mem_limit: 1g
    ports:
      - "29092:29092"   # accès depuis votre machine (producteur Python)
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ---------- Flink ----------
  flink-jobmanager:
    image: flink:1.18.1-java11
    container_name: flink-jobmanager
    command: jobmanager
    mem_limit: 1280m
    ports:
      - "8082:8081"     # interface web Flink
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
    volumes:
      - ./flink/jobs:/opt/flink/jobs
      - ./flink/lib:/opt/flink/usrlib   # jars (connecteur Kafka, etc.)

  flink-taskmanager:
    image: flink:1.18.1-java11
    container_name: flink-taskmanager
    command: taskmanager
    mem_limit: 1536m
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1280m
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./flink/lib:/opt/flink/usrlib

  # ---------- ClickHouse (stockage analytique) ----------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    mem_limit: 1536m
    ports:
      - "8123:8123"     # HTTP (Grafana, requêtes)
      - "9000:9000"     # protocole natif
    environment:
      CLICKHOUSE_DB: fraud
      CLICKHOUSE_USER: fraud
      CLICKHOUSE_PASSWORD: fraud123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d   # scripts SQL de création des tables
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ---------- Redis (compteurs / cache) ----------
  redis:
    image: redis:7-alpine
    container_name: redis
    mem_limit: 192m
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ---------- Grafana ----------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    mem_limit: 384m
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    depends_on:
      - clickhouse
    volumes:
      - grafana_data:/var/lib/grafana

  # ---------- Airflow (mode standalone) ----------
  airflow:
    image: apache/airflow:2.10.2
    container_name: airflow
    command: standalone
    mem_limit: 2g
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__WORKERS: 1
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: 1
      _PIP_ADDITIONAL_REQUIREMENTS: kafka-python pandas
    depends_on:
      - kafka
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data        # datasets CSV
      - airflow_data:/opt/airflow

volumes:
  kafka_data:
  clickhouse_data:
  redis_data:
  grafana_data:
  airflow_data: